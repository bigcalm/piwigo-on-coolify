services:
  piwigo-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT}
      MYSQL_DATABASE: piwigo
      MYSQL_USER: ${SERVICE_USER_MYSQL}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
    volumes:
      - piwigo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  piwigo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      piwigo-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PIWIGO_DB_HOST: piwigo-db
      PIWIGO_DB_PORT: 3306
      PIWIGO_DB_NAME: piwigo
      PIWIGO_DB_USER: ${SERVICE_USER_MYSQL}
      PIWIGO_DB_PASSWORD: ${SERVICE_PASSWORD_MYSQL}
      PIWIGO_DB_PREFIX: piwigo_
      PIWIGO_ADMIN_USER: ${PIWIGO_ADMIN_USER:-admin}
      PIWIGO_ADMIN_PASSWORD: ${SERVICE_PASSWORD_PIWIGO}
      PIWIGO_ADMIN_EMAIL: ${PIWIGO_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - piwigo-gallery-data:/var/www/html/_data/i
      - piwigo-local-data:/var/www/html/local
      - piwigo-upload-data:/var/www/html/upload
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  piwigo-nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    depends_on:
      - piwigo
    environment:
      - SERVICE_URL_PIWIGO-NGINX
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

volumes:
  piwigo-db-data:
  piwigo-gallery-data:
  piwigo-local-data:
  piwigo-upload-data: