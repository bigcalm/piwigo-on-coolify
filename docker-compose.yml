version: "3.8"

services:
  piwigo-db:
    image: mariadb:11
    container_name: piwigo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - piwigo-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - piwigo-network

  piwigo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piwigo
    restart: unless-stopped
    depends_on:
      piwigo-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      PIWIGO_DB_HOST: piwigo-db
      PIWIGO_DB_PORT: 3306
      PIWIGO_DB_NAME: ${MYSQL_DATABASE}
      PIWIGO_DB_USER: ${MYSQL_USER}
      PIWIGO_DB_PASSWORD: ${MYSQL_PASSWORD}
      PIWIGO_DB_PREFIX: piwigo_
    volumes:
      - piwigo-gallery-data:/var/www/html/_data/i
      - piwigo-local-data:/var/www/html/local
      - piwigo-upload-data:/var/www/html/upload
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    networks:
      - piwigo-network

  piwigo-nginx:
    image: nginx:alpine
    container_name: piwigo-nginx
    restart: unless-stopped
    depends_on:
      - piwigo
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - piwigo-gallery-data:/var/www/html/_data/i:ro
      - piwigo-local-data:/var/www/html/local:ro
      - piwigo-upload-data:/var/www/html/upload:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - piwigo-network

volumes:
  piwigo-db-data:
  piwigo-gallery-data:
  piwigo-local-data:
  piwigo-upload-data:

networks:
  piwigo-network:
    driver: bridge
